[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sieve-validation"
version = "0.1.0"
description = "Evidence infrastructure for deciding what a simulation result does and does not support. Local, offline, no score."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sieve-bench project" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "typer>=0.12",
    "jinja2>=3.1",
    "polars>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
sieve = "sieve.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sieve"]

[tool.hatch.build.targets.wheel.force-include]
"suites" = "sieve/_suites"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
